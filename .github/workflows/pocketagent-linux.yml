# DesktopAgent for Linux: the same Tauri app as Windows (src-tauri), as an
# AppImage (runs on most Linux systems) and a .deb, with the pinned llama.cpp
# server for local models: x64 (Vulkan + CPU) and arm64 (CPU; e.g. PineTab 2).
# Runs ONLY when asked: a manual run, or a change to
# .github/linux-build-request on the windows branch.
name: DesktopAgent Linux
on:
  push:
    branches: [windows]
    paths:
      - '.github/linux-build-request'
      - '.github/build-request'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktopagent-linux-${{ github.ref }}
  cancel-in-progress: false
env:
  # Pinned llama.cpp release (15 Oct 2026).
  LLAMA_TAG: b11662
jobs:
  linux:
    # Two builds: regular PCs (x64) and ARM (arm64: e.g. a PineTab 2).
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported base, so the app runs on more systems.
          - arch: x64
            runner: ubuntu-22.04
            llama_tar: llama-b11662-bin-ubuntu-vulkan-x64.tar.gz
            llama_sha256: f1f99964b67e3f8ca8efc9564db7c12d038862d1ca22b9311fc971544ccac446
          # ARM: llama.cpp's processor-only build (the graphics chips on ARM
          # tablets have unfinished Vulkan on Linux). It is built on 24.04,
          # so this needs glibc 2.39 or newer (Arch-based systems are fine).
          - arch: arm64
            runner: ubuntu-24.04-arm
            llama_tar: llama-b11662-bin-ubuntu-arm64.tar.gz
            llama_sha256: fe476ad75e27ffe610a96cab3453f39c2da41f0c04d9ef8e7befcd69de3cec64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      LLAMA_TAR: ${{ matrix.llama_tar }}
      LLAMA_SHA256: ${{ matrix.llama_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the version counts commits (scripts/build-info)
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - name: Install system libraries for the app window
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev file
      - name: Install locked dependencies and patches
        env:
          # llama.rn's own download runs in its own step below (cached).
          RNLLAMA_SKIP_POSTINSTALL: '1'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            [ "$attempt" = 3 ] && exit 1
            echo "Install attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore llama.rn's native libraries (cached copy)
        id: rnllama-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Get llama.rn's native libraries (checksum checked; skipped when cached)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            node node_modules/llama.rn/install/download-native-artifacts.js && break
            [ "$attempt" = 5 ] && exit 1
            echo "Attempt $attempt failed; trying again in 120 s"
            sleep 120
          done
      - name: Keep a copy of llama.rn's native libraries
        if: steps.rnllama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: TypeScript validation
        run: yarn typecheck
      - name: Desktop and safety rule tests
        run: yarn jest --runInBand --coverage=false stubs src/__tests__/securityRules.test.ts
      - name: Record which build this is (shown in App Info, compared over the home link)
        run: node scripts/build-info/write.js --apply
      - name: Build the web app (release)
        run: node scripts/web/build.js --release
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore the pinned llama.cpp archive (cached copy)
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLAMA_TAR }}
          key: llama-cpp-${{ env.LLAMA_SHA256 }}
      - name: Add the pinned llama.cpp server (checksum checked)
        run: |
          set -euo pipefail
          if [ ! -f "$LLAMA_TAR" ]; then
            curl -sSfL --retry 8 --retry-delay 60 --retry-all-errors -o "$LLAMA_TAR" \
              "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${LLAMA_TAR}"
          fi
          echo "${LLAMA_SHA256}  ${LLAMA_TAR}" | sha256sum -c -
          tar -xzf "$LLAMA_TAR" --strip-components=1 -C src-tauri/llama
          test -x src-tauri/llama/llama-server
      - name: Keep a copy of the llama.cpp archive
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LLAMA_TAR }}
          key: llama-cpp-${{ env.LLAMA_SHA256 }}
      - name: Rust tests (native side)
        working-directory: src-tauri
        run: cargo test --locked
      - name: Restore Tauri's packaging tools (cached copy)
        id: tauri-tools
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('yarn.lock') }}
      - name: Build the Linux packages
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            npx tauri build --bundles appimage,deb 2>&1 | tee linux-build.log && exit 0
            echo "Attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
          exit 1
      - name: Keep a copy of Tauri's packaging tools
        if: success() && steps.tauri-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('yarn.lock') }}
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: desktopagent-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktopagent-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: linux-build.log
          if-no-files-found: ignore
          retention-days: 3

  # Publishes the packages as a pre-release with direct download links.
  # Whatever built is published (an ARM failure doesn't hold back x64).
  release:
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktopagent-linux-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: pkg
      - name: Publish pre-release
        env:
          # Your own token (repo secret, this repo only: Contents + Workflows),
          # here only: the build token may not tag commits whose workflow
          # files differ from main's.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          tag="linux-${safe_branch}-${RUN_ID}-${RUN_ATTEMPT}"
          files=$(find pkg -type f \( -name '*.AppImage' -o -name '*.deb' \))
          if [ -z "$files" ]; then echo "Nothing built"; exit 1; fi
          gh release create "$tag" $files \
            --target "$SHA" \
            --prerelease \
            --title "DesktopAgent for Linux test build: ${BRANCH} (${SHA:0:7})" \
            --notes "Test build from branch \`${BRANCH}\`, commit ${SHA}, workflow run ${RUN_ID}. Not a release. AppImage: make it executable (chmod +x) and run it. .deb: Debian/Ubuntu."
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
