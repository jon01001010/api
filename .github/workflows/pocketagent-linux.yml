# DesktopAgent for Linux: the same Tauri app as Windows (src-tauri), as an
# AppImage (runs on most Linux systems) and a .deb, with the pinned llama.cpp
# server for local models: x64 (Vulkan + CPU) and arm64 (CPU; e.g. PineTab 2).
# Runs ONLY when asked: a manual run, or a change to
# .github/linux-build-request on the windows branch.
name: DesktopAgent Linux
on:
  push:
    branches: [windows]
    paths:
      - '.github/linux-build-request'
      - '.github/build-request'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktopagent-linux-${{ github.ref }}
  cancel-in-progress: false
env:
  # Pinned llama.cpp release (15 Oct 2026).
  LLAMA_TAG: b11662
  # Pinned stable-diffusion.cpp release (1 Nov 2026) for pictures on the PC
  # (src-tauri/src/image_gen.rs), built here from source on x64 (its own
  # Linux builds need Ubuntu 24.04+). CPU only for now (Vulkan: later; it
  # needs newer Vulkan headers and glslc than 22.04 has). ARM gets none:
  # pictures are far too slow there. Change both together, on purpose.
  SD_TAG: master-1039-290148d
  SD_COMMIT: 290148d2e31ca6ef9757d567905776b5f3646db5
  # The SHA-256 of the sd-cli built from SD_COMMIT (x64), copied by the owner
  # from a build's summary ("sd-cli SHA-256"). While it is set, a cached copy
  # must match it, not only the hash in its own cache key (which whoever
  # saved the cache wrote); empty: the key's hash is checked, as before.
  SD_CLI_SHA256: ''
jobs:
  linux:
    # Two builds: regular PCs (x64) and ARM (arm64: e.g. a PineTab 2).
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported base, so the app runs on more systems.
          - arch: x64
            runner: ubuntu-22.04
            llama_tar: llama-b11662-bin-ubuntu-vulkan-x64.tar.gz
            llama_sha256: f1f99964b67e3f8ca8efc9564db7c12d038862d1ca22b9311fc971544ccac446
            # Tauri's AppImage tools, pinned (see "Add the pinned AppImage tools").
            tools_arch: x86_64
            apprun_sha256: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
            linuxdeploy_sha256: 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
            appimage_plugin_sha256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
          # ARM: llama.cpp's processor-only build (the graphics chips on ARM
          # tablets have unfinished Vulkan on Linux). It is built on 24.04,
          # so this needs glibc 2.39 or newer (Arch-based systems are fine).
          - arch: arm64
            runner: ubuntu-24.04-arm
            llama_tar: llama-b11662-bin-ubuntu-arm64.tar.gz
            llama_sha256: fe476ad75e27ffe610a96cab3453f39c2da41f0c04d9ef8e7befcd69de3cec64
            tools_arch: aarch64
            apprun_sha256: 072f17c0895a85c490282fe5395c5007e5fc75da727e553b3b8fb680feb11578
            linuxdeploy_sha256: 556ab80baa98e600aa80f0dcedfb70bca0e1ce7e9f147fb345be3fcc3e91b2b1
            appimage_plugin_sha256: 83c292149274965a865dcd44c135cfca8ba28c6b7de3eb628d4b8b5f248af17c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      LLAMA_TAR: ${{ matrix.llama_tar }}
      LLAMA_SHA256: ${{ matrix.llama_sha256 }}
      TOOLS_ARCH: ${{ matrix.tools_arch }}
      APPRUN_SHA256: ${{ matrix.apprun_sha256 }}
      LINUXDEPLOY_SHA256: ${{ matrix.linuxdeploy_sha256 }}
      APPIMAGE_PLUGIN_SHA256: ${{ matrix.appimage_plugin_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # the version counts commits (scripts/build-info)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.0'
      - name: Install system libraries for the app window
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev file
      - name: Install locked dependencies and patches
        env:
          # llama.rn's own download runs in its own step below (cached).
          RNLLAMA_SKIP_POSTINSTALL: '1'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            [ "$attempt" = 3 ] && exit 1
            echo "Install attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore llama.rn's native libraries (cached copy)
        id: rnllama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Get llama.rn's native libraries (checksum checked; skipped when cached)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            node node_modules/llama.rn/install/download-native-artifacts.js && break
            [ "$attempt" = 5 ] && exit 1
            echo "Attempt $attempt failed; trying again in 120 s"
            sleep 120
          done
      # The download checks the archive; a cached copy was trusted by its
      # marker file alone. Every file is checked against the list kept in
      # the repository (scripts/native-libs).
      - name: Check llama.rn's native libraries file by file
        run: node scripts/native-libs/check-native.js
      - name: Keep a copy of llama.rn's native libraries
        if: steps.rnllama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: TypeScript validation
        run: yarn typecheck
      - name: Desktop and safety rule tests
        run: yarn jest --runInBand --coverage=false stubs src/__tests__/securityRules.test.ts
      - name: Record which build this is (shown in App Info, compared over the home link)
        run: node scripts/build-info/write.js --apply
      - name: Build the web app (release)
        run: node scripts/web/build.js --release
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore the pinned llama.cpp archive (cached copy)
        id: llama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LLAMA_TAR }}
          key: llama-cpp-${{ env.LLAMA_SHA256 }}
      - name: Add the pinned llama.cpp server (checksum checked)
        run: |
          set -euo pipefail
          if [ ! -f "$LLAMA_TAR" ]; then
            curl -sSfL --retry 8 --retry-delay 60 --retry-all-errors -o "$LLAMA_TAR" \
              "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${LLAMA_TAR}"
          fi
          echo "${LLAMA_SHA256}  ${LLAMA_TAR}" | sha256sum -c -
          tar -xzf "$LLAMA_TAR" --strip-components=1 -C src-tauri/llama
          test -x src-tauri/llama/llama-server
      - name: Keep a copy of the llama.cpp archive
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LLAMA_TAR }}
          key: llama-cpp-${{ env.LLAMA_SHA256 }}
      # The cached copy's key ends with the SHA-256 of the sd-cli it holds,
      # recorded when it was built; a restored copy must match it, or the
      # build fails (never a silent rebuild). There is no exact key: the
      # newest copy for this commit and runner is taken by its prefix.
      - name: Restore the pinned picture maker build (cached copy)
        id: sd-cache
        if: matrix.arch == 'x64'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: sd-built
          key: sd-cli-${{ env.SD_COMMIT }}-cpu-avx2-${{ matrix.runner }}-sha256-none
          restore-keys: |
            sd-cli-${{ env.SD_COMMIT }}-cpu-avx2-${{ matrix.runner }}-sha256-
      - name: Build the pinned picture maker sd-cli (x64, CPU; checked against its recorded SHA-256 when cached)
        id: sd-build
        if: matrix.arch == 'x64'
        env:
          CACHED_KEY: ${{ steps.sd-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -n "$CACHED_KEY" ]; then
            expected="${CACHED_KEY##*-sha256-}"
            # The SHA-256 pinned here wins over the one in the cache's key.
            if [ -n "$SD_CLI_SHA256" ] && [ "$expected" != "$SD_CLI_SHA256" ]; then
              echo "::error::The cached sd-cli's recorded SHA-256 is not the one pinned in this workflow (SD_CLI_SHA256)."
              exit 1
            fi
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::The cached sd-cli has no recorded SHA-256 ($CACHED_KEY)."
              exit 1
            fi
            # A plain file, not a link, and exactly the binary that was built.
            test -f sd-built/sd-cli && test ! -L sd-built/sd-cli
            if ! echo "${expected}  sd-built/sd-cli" | sha256sum -c -; then
              echo "::error::The cached sd-cli does not match the SHA-256 recorded when it was built."
              exit 1
            fi
          else
            rm -rf sd-built
            git clone --quiet --depth 1 --branch "$SD_TAG" --recurse-submodules \
              --shallow-submodules https://github.com/leejet/stable-diffusion.cpp sd-src
            # The tag must still be the pinned commit.
            test "$(git -C sd-src rev-parse HEAD)" = "$SD_COMMIT"
            # One self-contained program; AVX2 (PCs from 2013 on), not this
            # runner's own processor features.
            cmake -S sd-src -B sd-src/build -DCMAKE_BUILD_TYPE=Release \
              -DSD_BUILD_EXAMPLES=ON -DSD_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF \
              -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=OFF \
              -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
            cmake --build sd-src/build --config Release -j"$(nproc)"
            mkdir -p sd-built
            cp sd-src/build/bin/sd-cli sd-built/
          fi
          sha=$(sha256sum sd-built/sd-cli | cut -d' ' -f1)
          if [ -n "$SD_CLI_SHA256" ] && [ "$sha" != "$SD_CLI_SHA256" ]; then
            echo "::warning::This sd-cli's SHA-256 is not SD_CLI_SHA256 (a fresh build of the same commit can differ): check it, then pin the new one."
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "sd-cli SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          cp sd-built/sd-cli src-tauri/sd/sd-cli
          chmod +x src-tauri/sd/sd-cli
          ldd src-tauri/sd/sd-cli
          ! ldd src-tauri/sd/sd-cli | grep -q 'not found'
          # It starts (all its libraries found); its help text may end non-zero.
          (src-tauri/sd/sd-cli --help || true) | head -5
      - name: Keep a copy of the picture maker build
        if: matrix.arch == 'x64' && steps.sd-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: sd-built
          key: sd-cli-${{ env.SD_COMMIT }}-cpu-avx2-${{ matrix.runner }}-sha256-${{ steps.sd-build.outputs.sha256 }}
      - name: Rust tests (native side)
        working-directory: src-tauri
        run: cargo test --locked
      # Tauri's AppImage tools. The bundler (tauri-bundler 2.10.3, in the
      # Tauri CLI 2.12.3 that yarn.lock pins: src/bundle/linux/appimage/
      # linuxdeploy.rs, prepare_tools) downloads AppRun, linuxdeploy and
      # linuxdeploy-plugin-appimage into ~/.cache/tauri without any
      # checksum, the plugin from a moving `continuous` release, and the
      # cache of that folder was keyed on yarn.lock only. Here each comes
      # from a fixed release, is checked against its SHA-256 (also when it
      # comes from the cache, keyed on those SHA-256s), and is put where the
      # bundler looks, under the names it looks for, so it downloads none.
      # The bundler changes its linuxdeploy copy in place (3 bytes zeroed),
      # so only the untouched copies in appimage-tools are cached.
      - name: Restore the pinned AppImage tools (cached copy)
        id: appimage-tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: appimage-tools
          key: appimage-tools-${{ matrix.tools_arch }}-${{ matrix.apprun_sha256 }}-${{ matrix.linuxdeploy_sha256 }}-${{ matrix.appimage_plugin_sha256 }}
      - name: Add the pinned AppImage tools (checksums checked)
        run: |
          set -euo pipefail
          # Written for this bundler version only; a new Tauri CLI may name
          # or fetch them differently: check linuxdeploy.rs, then update.
          cli=$(node -p "require('@tauri-apps/cli/package.json').version")
          if [ "$cli" != "2.12.3" ]; then
            echo "::error::Tauri CLI $cli: check its tauri-bundler's AppImage tools (prepare_tools) and update this step."
            exit 1
          fi
          mkdir -p appimage-tools
          get() { # file, address, SHA-256
            local file="appimage-tools/$1"
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              rm -f "$file"
              curl -sSfL --retry 8 --retry-delay 60 --retry-all-errors -o "$file" "$2"
            fi
            echo "$3  $file" | sha256sum -c -
          }
          releases=https://github.com/tauri-apps/binary-releases/releases/download
          get "AppRun-$TOOLS_ARCH" "$releases/apprun-old/AppRun-$TOOLS_ARCH" "$APPRUN_SHA256"
          get "linuxdeploy-$TOOLS_ARCH.AppImage" \
            "$releases/linuxdeploy-07333c6/linuxdeploy-$TOOLS_ARCH.AppImage" "$LINUXDEPLOY_SHA256"
          # A fixed release of the plugin, not `continuous`.
          get "linuxdeploy-plugin-appimage-$TOOLS_ARCH.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-$TOOLS_ARCH.AppImage" \
            "$APPIMAGE_PLUGIN_SHA256"
          # Where the bundler looks (dirs::cache_dir()/tauri), fresh.
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          rm -rf "$tools"
          mkdir -p "$tools"
          install -m 755 "appimage-tools/AppRun-$TOOLS_ARCH" "$tools/AppRun-$TOOLS_ARCH"
          install -m 755 "appimage-tools/linuxdeploy-$TOOLS_ARCH.AppImage" "$tools/linuxdeploy-07333c6-$TOOLS_ARCH.AppImage"
          install -m 755 "appimage-tools/linuxdeploy-plugin-appimage-$TOOLS_ARCH.AppImage" "$tools/linuxdeploy-plugin-appimage.AppImage"
          ls -la "$tools"
      - name: Keep a copy of the pinned AppImage tools
        if: steps.appimage-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: appimage-tools
          key: appimage-tools-${{ matrix.tools_arch }}-${{ matrix.apprun_sha256 }}-${{ matrix.linuxdeploy_sha256 }}-${{ matrix.appimage_plugin_sha256 }}
      - name: Build the Linux packages
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            npx tauri build --bundles appimage,deb 2>&1 | tee linux-build.log && exit 0
            echo "Attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
          exit 1
      - name: Upload the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktopagent-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktopagent-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: linux-build.log
          if-no-files-found: ignore
          retention-days: 3

  # Publishes the packages as a pre-release with direct download links.
  # Whatever built is published (an ARM failure doesn't hold back x64).
  release:
    needs: linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance (who built what, from which commit), checked with
      # `gh attestation verify`: this job only.
      id-token: write
      attestations: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktopagent-linux-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: pkg
      - name: Write the checksums
        run: |
          set -euo pipefail
          # Flat names (merge-multiple puts each package in its own folder).
          find pkg -mindepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec mv -n {} pkg/ \;
          cd pkg
          shopt -s nullglob
          packages=(*.AppImage *.deb)
          if [ ${#packages[@]} -eq 0 ]; then echo "Nothing built"; exit 1; fi
          sha256sum -- "${packages[@]}" > SHA256SUMS
          cat SHA256SUMS
      # GitHub's own action; it never fails the release (attestations need a
      # public repository or a paid plan).
      - name: Record build provenance for the packages
        continue-on-error: true
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            pkg/*.AppImage
            pkg/*.deb
      - name: Publish pre-release
        env:
          # Your own token (repo secret, this repo only: Contents + Workflows),
          # here only: the build token may not tag commits whose workflow
          # files differ from main's.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          tag="linux-${safe_branch}-${RUN_ID}-${RUN_ATTEMPT}"
          files=$(find pkg -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \))
          if [ -z "$files" ]; then echo "Nothing built"; exit 1; fi
          test -s pkg/SHA256SUMS
          gh release create "$tag" $files pkg/SHA256SUMS \
            --target "$SHA" \
            --prerelease \
            --title "DesktopAgent for Linux test build: ${BRANCH} (${SHA:0:7})" \
            --notes "Test build from branch \`${BRANCH}\`, commit ${SHA}, workflow run ${RUN_ID}. Not a release. AppImage: make it executable (chmod +x) and run it. .deb: Debian/Ubuntu. SHA256SUMS holds their SHA-256 checksums."
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
