name: Package Razr FastRPC device probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v69-fastrpc-device-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up verified Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk
      - name: Build device probe and document deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report/generated
          {
            cat > report/generated/pocketagent_probe.idl <<'EOF'
          interface pocketagent_probe {
              long add(in long a, in long b, rout long result);
          };
          EOF
            cd report/generated
            "$HEXAGON_SDK_ROOT/ipc/fastrpc/qaic/bin/qaic" pocketagent_probe.idl
            cat > pocketagent_probe_impl.c <<'EOF'
          #include "pocketagent_probe.h"
          int pocketagent_probe_add(int a, int b, int *result) {
              if (!result) return -1;
              *result = a + b;
              return 0;
          }
          EOF
            cat > pocketagent_probe_main.c <<'EOF'
          #include <stdio.h>
          #include "pocketagent_probe.h"
          int main(void) {
              int value = -1;
              int rc = pocketagent_probe_add(7, 11, &value);
              printf("FastRPC result rc=%d value=%d expected=18\n", rc, value);
              return (rc == 0 && value == 18) ? 0 : 1;
          }
          EOF
            mapfile -t dirs < <(find "$HEXAGON_SDK_ROOT" \( -name AEEStdDef.h -o -name remote.h -o -name AEEStdErr.h \) -printf '%h\n' | sort -u)
            args=(-I.)
            for d in "${dirs[@]}"; do args+=("-I$d"); done
            DSP="$HEXAGON_TOOLS_ROOT/Tools/bin/hexagon-clang"
            "$DSP" -mv69 -O2 -fPIC "${args[@]}" -c pocketagent_probe_skel.c -o pocketagent_probe_skel.o
            "$DSP" -mv69 -O2 -fPIC "${args[@]}" -c pocketagent_probe_impl.c -o pocketagent_probe_impl.o
            "$DSP" -mv69 -shared -fPIC -nostdlib pocketagent_probe_skel.o pocketagent_probe_impl.o -o libpocketagent_probe_skel.so
            echo '## DSP ELF'
            file libpocketagent_probe_skel.so
            NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -z "$NDK" ] && [ -d "$ANDROID_HOME/ndk" ]; then
              NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            fi
            test -n "$NDK"
            CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            "$CC" -fPIC "${args[@]}" -c pocketagent_probe_stub.c -o pocketagent_probe_stub_android.o
            "$CC" "${args[@]}" -c pocketagent_probe_main.c -o pocketagent_probe_main.o
            echo '## Link Android executable against SDK FastRPC library'
            "$CC" pocketagent_probe_stub_android.o pocketagent_probe_main.o -L"$HEXAGON_SDK_ROOT/ipc/fastrpc/remote/ship/android_aarch64" -lcdsprpc -o pocketagent_probe_android
            file pocketagent_probe_android
            echo 'PASS: Android probe executable and DSP ELF produced'
            echo 'NOTE: DSP ELF is not signed, runtime-tested, or guaranteed deployable.'
          } 2>&1 | tee report/result.txt
      - name: Deployment notes
        if: always()
        shell: bash
        run: |
          cat > report/README.txt <<'EOF'
          Experimental build outputs only. Do not install this DSP ELF into system partitions.
          No ADB command is run by CI. No device execution is claimed.
          First check Android FastRPC runtime availability, device DSP domain, access policy,
          expected DSP skel naming, and Qualcomm signing requirements.
          Host executable may require compatible vendor runtime libraries.
          Keep PocketAgent CPU APK unchanged.
          EOF
      - name: Upload report and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v69-fastrpc-device-probe-${{ github.run_id }}
          path: report/
          retention-days: 14
