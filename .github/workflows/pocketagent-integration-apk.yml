# Verify dual-memory UI and context integration (2026-11-02).
# Validate repository hardening and memory fixes (2026-11-02).
# Memory tool batch integration CI (2026-11-02).
# Batch 1-3 integration diagnostic APK (2026-11-02).
# Rebuild after fixing settings-aware duplicate import test (2026-11-02).
# Build TXT cached-file sharing and initial configurable workspace limits (2026-11-02).
# Trigger Android APK build with workspace export URI fix (2026-11-01).
# Build workspace browser and Android file sharing export (2026-11-01).
name: PocketAgent integration APK
# Validate RNFS namespace runtime fix for Android file workspace (2026-11-01).
on:
  push:
    branches: [main, windows]
    paths:
      # Only on request: one file starts the phone and the PC builds
      # together, from the same commit, so they always match.
      - '.github/build-request'
  workflow_dispatch:
    inputs:
      stage:
        description: Run one build stage
        type: choice
        default: apk
        options: [configuration, compilation, native, apk]
permissions:
  contents: read
concurrency:
  group: pocketagent-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # the version counts commits (scripts/build-info)
      - name: Free runner disk space for native SDK
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          # Preinstalled toolchains not needed for this Android build.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          echo "Disk after cleanup:"
          df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.0.0'
          cache-read-only: false
          cache-cleanup: always
      - name: Install locked dependencies and patches
        env:
          # llama.rn's own download runs in its own step below (cached).
          RNLLAMA_SKIP_POSTINSTALL: '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          chmod +x scripts/postinstall.sh
          npm install --global yarn@1.22.22
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            [ "$attempt" = 3 ] && exit 1
            echo "Install attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
          node node_modules/patch-package/index.js --error-on-fail
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore llama.rn's native libraries (cached copy)
        id: rnllama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Get llama.rn's native libraries (checksum checked; skipped when cached)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            node node_modules/llama.rn/install/download-native-artifacts.js && break
            [ "$attempt" = 5 ] && exit 1
            echo "Attempt $attempt failed; trying again in 120 s"
            sleep 120
          done
      # The download checks the archive; a cached copy was trusted by its
      # marker file alone. Every file is checked against the list kept in
      # the repository (scripts/native-libs).
      - name: Check llama.rn's native libraries file by file
        run: node scripts/native-libs/check-native.js
      - name: Keep a copy of llama.rn's native libraries
        if: steps.rnllama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Record which build this is (shown in App Info, compared over the home link)
        run: node scripts/build-info/write.js --apply
      - name: TypeScript validation
        run: yarn typecheck
      - name: Custom tool storage tests
        run: yarn jest --runInBand --coverage=false CustomToolStorageAdapter
      - name: File workspace regression tests
        run: yarn jest --runInBand --coverage=false fileWorkspace
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - name: Install Android packages
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'ndk;27.0.12077973' 'cmake;3.22.1'
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from android_build_tools import normalize_ndk
          for revision in ('27.3.13750724', '27.0.12077973'):
              compiler = normalize_ndk(Path(os.environ['ANDROID_HOME']) / 'ndk' / revision, revision)
              subprocess.run([str(compiler), '--version'], check=True)
          PY
      - name: Reclaim SDK installation caches
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          rm -rf "$HOME/.npm/_cacache" "$HOME/.cache/yarn" || true
          # sdkmanager can leave large temporary archives after installing NDKs.
          rm -rf "$HOME/.android/cache" || true
          echo 'Disk after Android SDK installation:'
          df -h /
      - name: Remove unused preinstalled Android NDKs
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          # Keep only the two explicitly pinned NDK versions installed above.
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ -d "$ndk" ] || continue
            case "${ndk##*/}" in
              27.3.13750724|27.0.12077973) ;;
              *) echo "Removing unused NDK: $ndk"; rm -rf "$ndk" ;;
            esac
          done
          df -h /
      # Home link, phone side (native/homelink): use the home PC's model from
      # anywhere. Built for ARM64 with the NDK pinned above into jniLibs.
      - name: Build the home link library (Rust)
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native' || inputs.stage == 'compilation'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          # cargo-ndk 4 reads the crate from the current folder (its
          # --manifest-path is not used for that), so run it from there.
          (cd native/homelink && cargo ndk -t arm64-v8a --platform 24 \
            -o ../../android/app/src/main/jniLibs build --release --locked --features android)
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          rm -rf native/homelink/target
      - name: Prepare diagnostic configuration
        run: python3 scripts/prepare-diagnostic-config.py
      - name: Verify Hexagon SDK for APK stage
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        uses: ./.github/actions/setup-hexagon-sdk
      - name: Configuration
        if: inputs.stage == 'configuration'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a help 2>&1 | tee diagnostic-build.log
      - name: Compilation
        if: inputs.stage == 'compilation'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a :app:compileProdReleaseKotlin :app:compileProdReleaseJavaWithJavac 2>&1 | tee diagnostic-build.log
      # Restore native intermediates from a prior attempt with matching inputs.
      # Cache reuse is best-effort and does not establish build correctness.
      - name: Validate native variant selection
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          node scripts/verify-android-payload.js --print-variants | tee native-variants.txt
          test -s native-variants.txt
          echo 'Required ARM64 native variants:'
          cat native-variants.txt
      - name: Restore native build intermediates
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/.cxx
            node_modules/llama.rn/android/build/intermediates/cxx
            node_modules/llama.rn/android/build/generated/source/codegen
          key: pocketagent-native-arm64-release-v3-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            pocketagent-native-arm64-release-v3-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-
      - name: Inspect native cache and disk budget
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          echo 'Disk available before native compilation:'
          df -h /
          echo 'Cached llama.rn native build directories:'
          du -sh node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx node_modules/llama.rn/android/build/generated/source/codegen 2>/dev/null || true
          echo 'Largest Android and Gradle directories:'
          du -sh android/.gradle android/app/.cxx android/app/build "$HOME/.gradle/caches" "$HOME/.hexagon-sdk" 2>/dev/null || true
          free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if (( free_kb < 6291456 )); then
            echo "::error::Less than 6 GiB free before native compilation; refusing to exhaust runner disk." >&2
            exit 1
          fi
      # Rebuild after PocketAgent onboarding and Toolbox navigation updates.
      - name: Assemble and verify NPU APK
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        timeout-minutes: 110
        run: |
          set -euo pipefail
          bash scripts/build-api-helper-npu.sh 2>&1 | tee diagnostic-build.log
      # The published APK must be the release variant: not debuggable (a
      # debuggable app gives `adb run-as` its private files on any unlocked
      # phone) and with its JS bundle built in (dev support would load code
      # from any "Metro" listening on the phone). Checked here and again in
      # the signing job, before any key touches it.
      - name: Check the APK is a release build (not debuggable, bundle built in)
        if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          test -s "$apk"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          # Not debuggable: no application-debuggable in badging, and no
          # android:debuggable other than false in the manifest.
          badging=$("$aapt2" dump badging "$apk")
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q "^package: name='org.apihelper.local'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::The APK is debuggable; only a release build may be published."
            exit 1
          fi
          flags=$(grep -oE ':debuggable\(0x0101000f\)=[^ ]+' <<< "$manifest" || true)
          if [ -n "$flags" ] && grep -qvE '=false$' <<< "$flags"; then
            echo "::error::The APK's manifest sets android:debuggable ($flags)."
            exit 1
          fi
          # The JS is built in as Hermes bytecode, so it never asks a "Metro".
          python3 -I - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              head = z.open('assets/index.android.bundle').read(8)
          if head != bytes.fromhex('c61fbc03c103191f'):
              sys.exit('assets/index.android.bundle is not Hermes bytecode')
          PY
          echo "Release build: not debuggable, Hermes bundle built in."
      - name: Record native build disk usage
        if: always() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        run: |
          echo 'Disk after native build:' > native-build-diagnostics.txt
          df -h / >> native-build-diagnostics.txt
          echo 'Native build cache sizes:' >> native-build-diagnostics.txt
          du -sh node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx node_modules/llama.rn/android/build/generated/source/codegen android/app/.cxx android/app/build 2>/dev/null >> native-build-diagnostics.txt || true
          echo 'Native object counts:' >> native-build-diagnostics.txt
          for dir in node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx android/app/.cxx; do
            if [ -d "$dir" ]; then
              printf '%s: ' "$dir" >> native-build-diagnostics.txt
              find "$dir" -type f -name '*.o' | wc -l >> native-build-diagnostics.txt
            fi
          done
          cat native-build-diagnostics.txt
      - name: Save native compilation progress
        if: always() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/llama.rn/android/.cxx
            node_modules/llama.rn/android/build/intermediates/cxx
            node_modules/llama.rn/android/build/generated/source/codegen
          key: pocketagent-native-arm64-release-v3-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-logs-${{ inputs.stage || 'configuration' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-build.log
            native-build-diagnostics.txt
            native-variants.txt
            android/app/build/outputs/api-helper-npu-payload.txt
          if-no-files-found: warn
          # Small, but 14 days of them added up; 3 days is enough to debug.
          retention-days: 3
      - name: Keep verified APK
        if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketagent-integration-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          # Only the jobs below need this copy (minutes later); the APK to
          # install lives on the release. 14-day copies (~80 MB each) filled
          # the free Actions storage.
          retention-days: 1

  # Signs the APK with our release key, once the owner has added it (TODO.md,
  # Pre-release: "Signed builds"), on a fresh runner that ran none of the
  # build's code (npm install scripts, Gradle plugins, the NDK build): it only
  # downloads the built APK and uses the runner's own Android SDK (pinned
  # build-tools). Without the key's secrets the APK keeps React Native's
  # public debug signature, as before. The key is written to the runner's
  # temporary folder only for apksigner and removed after. Forks never
  # receive these secrets. This job has no repository permissions.
  sign:
    needs: diagnostic
    if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    env:
      BUILD_TOOLS: '36.0.0'
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pocketagent-integration-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: built
      - name: Use the runner's Android build-tools (pinned version)
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools="$sdk/build-tools/$BUILD_TOOLS"
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/aapt2" ]; then
            # Not preinstalled on this image: the SDK manager checks the
            # package's checksum from the Android repository.
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" > /dev/null
          fi
          test -x "$tools/apksigner"
          test -x "$tools/aapt2"
          sha256sum "$tools/lib/apksigner.jar" "$tools/aapt2"
          echo "BUILD_TOOLS_DIR=$tools" >> "$GITHUB_ENV"
      - name: Check the APK is a release build before signing (not debuggable, bundle built in)
        run: |
          set -euo pipefail
          # Only the APK came from the build; this job runs nothing of it.
          mv built/app-prod-release.apk app-prod-release.apk
          apk=app-prod-release.apk
          test -s "$apk"
          aapt2="$BUILD_TOOLS_DIR/aapt2"
          # Not debuggable: no application-debuggable in badging, and no
          # android:debuggable other than false in the manifest.
          badging=$("$aapt2" dump badging "$apk")
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q "^package: name='org.apihelper.local'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::The APK is debuggable; only a release build may be published."
            exit 1
          fi
          flags=$(grep -oE ':debuggable\(0x0101000f\)=[^ ]+' <<< "$manifest" || true)
          if [ -n "$flags" ] && grep -qvE '=false$' <<< "$flags"; then
            echo "::error::The APK's manifest sets android:debuggable ($flags)."
            exit 1
          fi
          # The JS is built in as Hermes bytecode, so it never asks a "Metro".
          python3 -I - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              head = z.open('assets/index.android.bundle').read(8)
          if head != bytes.fromhex('c61fbc03c103191f'):
              sys.exit('assets/index.android.bundle is not Hermes bytecode')
          PY
          echo "Release build: not debuggable, Hermes bundle built in."
      - name: Sign the APK with our release key (when its secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=app-prod-release.apk
          test -s "$apk"
          apksigner="$BUILD_TOOLS_DIR/apksigner"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No release key set: the APK keeps the debug signature."
            certs=$("$apksigner" verify --print-certs "$apk")
            grep -q 'CN=Android Debug' <<< "$certs"
            echo "debug" > signed-with.txt
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing."
            exit 1
          fi
          # A key made with keytool's defaults (PKCS12) has one password.
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore")
          # Replaces the debug signature (v1-v3 schemes for minSdk 24).
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out signed.apk "$apk"
          rm -f "$keystore"
          mv signed.apk "$apk"
          certs=$("$apksigner" verify --verbose --print-certs "$apk")
          grep -E '^(Verified|Signer #1 certificate (DN|SHA-256))' <<< "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The APK is still signed with the debug key."
            exit 1
          fi
          echo "release" > signed-with.txt
      - name: Check the signed APK (signature valid, still not debuggable)
        run: |
          set -euo pipefail
          apk=app-prod-release.apk
          "$BUILD_TOOLS_DIR/apksigner" verify "$apk"
          aapt2="$BUILD_TOOLS_DIR/aapt2"
          # Not debuggable: no application-debuggable in badging, and no
          # android:debuggable other than false in the manifest.
          badging=$("$aapt2" dump badging "$apk")
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q "^package: name='org.apihelper.local'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::The APK is debuggable; only a release build may be published."
            exit 1
          fi
          flags=$(grep -oE ':debuggable\(0x0101000f\)=[^ ]+' <<< "$manifest" || true)
          if [ -n "$flags" ] && grep -qvE '=false$' <<< "$flags"; then
            echo "::error::The APK's manifest sets android:debuggable ($flags)."
            exit 1
          fi
          # The JS is built in as Hermes bytecode, so it never asks a "Metro".
          python3 -I - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              head = z.open('assets/index.android.bundle').read(8)
          if head != bytes.fromhex('c61fbc03c103191f'):
              sys.exit('assets/index.android.bundle is not Hermes bytecode')
          PY
          echo "Release build: not debuggable, Hermes bundle built in."
      - name: Keep the signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketagent-signed-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app-prod-release.apk
            signed-with.txt
          if-no-files-found: error
          retention-days: 1

  # Publishes the verified APK as a pre-release so it can be downloaded and
  # installed directly on the phone (artifacts need a signed-in browser and
  # arrive zipped). Only this job can write to the repository: it runs no
  # third-party actions, just GitHub's artifact download, GitHub's build
  # provenance and the gh CLI.
  release:
    needs: sign
    if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance (who built what, from which commit), checked with
      # `gh attestation verify`: this job only.
      id-token: write
      attestations: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pocketagent-signed-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk
      - name: Name the APK and write its checksum
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          asset="PocketAgent-${safe_branch}-${RUN_ID}.apk"
          test -s apk/app-prod-release.apk
          mv apk/app-prod-release.apk "apk/${asset}"
          (cd apk && sha256sum "$asset" > SHA256SUMS)
          cat apk/SHA256SUMS
      # GitHub's own action; it never fails the release (attestations need a
      # public repository or a paid plan).
      - name: Record build provenance for the APK
        continue-on-error: true
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: apk/PocketAgent-*.apk
      - name: Publish pre-release
        env:
          # Your own token (repo secret, this repo only: Contents + Workflows),
          # here only: the build token may not tag commits whose workflow
          # files differ from main's.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          tag="apk-${safe_branch}-${RUN_ID}-${RUN_ATTEMPT}"
          asset="PocketAgent-${safe_branch}-${RUN_ID}.apk"
          test -s "apk/${asset}"
          test -s apk/SHA256SUMS
          case "$(cat apk/signed-with.txt)" in
            release) key="our release key" ;;
            debug) key="React Native's public debug key (the owner's key is not set yet)" ;;
            *) echo "::error::Unknown signing key"; exit 1 ;;
          esac
          gh release create "$tag" "apk/${asset}" apk/SHA256SUMS \
            --target "$SHA" \
            --prerelease \
            --title "PocketAgent test APK: ${BRANCH} (${SHA:0:7})" \
            --notes "Test build (release variant, not debuggable) from branch \`${BRANCH}\`, commit ${SHA}, workflow run ${RUN_ID}, signed with ${key}. Not a release. Tap the .apk below on the phone to download and install. SHA256SUMS holds its SHA-256 checksum."
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
