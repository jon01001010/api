name: PocketAgent integration APK
on:
  push:
    branches: [pocketagent-step1-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true
      - name: Reclaim runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: TypeScript validation
        run: yarn typecheck
      - name: Custom tool storage tests
        run: yarn jest --runInBand --coverage=false CustomToolStorageAdapter
      - name: Build prodDebug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleProdDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketagent-prod-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
