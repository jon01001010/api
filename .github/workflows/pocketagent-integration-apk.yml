# Verify dual-memory UI and context integration (2026-11-02).
# Validate repository hardening and memory fixes (2026-11-02).
# Memory tool batch integration CI (2026-11-02).
# Batch 1-3 integration diagnostic APK (2026-11-02).
# Rebuild after fixing settings-aware duplicate import test (2026-11-02).
# Build TXT cached-file sharing and initial configurable workspace limits (2026-11-02).
# Trigger Android APK build with workspace export URI fix (2026-11-01).
# Build workspace browser and Android file sharing export (2026-11-01).
name: PocketAgent integration APK
# Validate RNFS namespace runtime fix for Android file workspace (2026-11-01).
on:
  push:
    branches: [main, windows]
    paths:
      # Only on request: one file starts the phone and the PC builds
      # together, from the same commit, so they always match.
      - '.github/build-request'
  workflow_dispatch:
    inputs:
      stage:
        description: Run one build stage
        type: choice
        default: apk
        options: [configuration, compilation, native, apk]
permissions:
  contents: read
concurrency:
  group: pocketagent-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the version counts commits (scripts/build-info)
      - name: Free runner disk space for native SDK
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          # Preinstalled toolchains not needed for this Android build.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          echo "Disk after cleanup:"
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
          cache-read-only: false
          cache-cleanup: always
      - name: Install locked dependencies and patches
        env:
          # llama.rn's own download runs in its own step below (cached).
          RNLLAMA_SKIP_POSTINSTALL: '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          chmod +x scripts/postinstall.sh
          npm install --global yarn@1.22.22
          # GitHub's release downloads can fail for a while (504s seen 2026-11-08):
          # try again a few times before giving up.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && break
            [ "$attempt" = 3 ] && exit 1
            echo "Install attempt $attempt failed; trying again in 60 s"
            sleep 60
          done
          node node_modules/patch-package/index.js --error-on-fail
      # Pinned downloads come from a cached copy (checked against their pinned
      # checksums) so builds don't depend on GitHub's release downloads, which
      # returned 504 for hours on 2026-11-08.
      - name: Restore llama.rn's native libraries (cached copy)
        id: rnllama-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Get llama.rn's native libraries (checksum checked; skipped when cached)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            node node_modules/llama.rn/install/download-native-artifacts.js && break
            [ "$attempt" = 5 ] && exit 1
            echo "Attempt $attempt failed; trying again in 120 s"
            sleep 120
          done
      - name: Keep a copy of llama.rn's native libraries
        if: steps.rnllama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/llama.rn/android/src/main/jniLibs
            node_modules/llama.rn/ios/rnllama.xcframework
          key: llama-rn-native-${{ hashFiles('node_modules/llama.rn/install/native-artifacts.json') }}
      - name: Record which build this is (shown in App Info, compared over the home link)
        run: node scripts/build-info/write.js --apply
      - name: TypeScript validation
        run: yarn typecheck
      - name: Custom tool storage tests
        run: yarn jest --runInBand --coverage=false CustomToolStorageAdapter
      - name: File workspace regression tests
        run: yarn jest --runInBand --coverage=false fileWorkspace
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Install Android packages
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'ndk;27.0.12077973' 'cmake;3.22.1'
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from android_build_tools import normalize_ndk
          for revision in ('27.3.13750724', '27.0.12077973'):
              compiler = normalize_ndk(Path(os.environ['ANDROID_HOME']) / 'ndk' / revision, revision)
              subprocess.run([str(compiler), '--version'], check=True)
          PY
      - name: Reclaim SDK installation caches
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          rm -rf "$HOME/.npm/_cacache" "$HOME/.cache/yarn" || true
          # sdkmanager can leave large temporary archives after installing NDKs.
          rm -rf "$HOME/.android/cache" || true
          echo 'Disk after Android SDK installation:'
          df -h /
      - name: Remove unused preinstalled Android NDKs
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          # Keep only the two explicitly pinned NDK versions installed above.
          for ndk in "$ANDROID_HOME"/ndk/*; do
            [ -d "$ndk" ] || continue
            case "${ndk##*/}" in
              27.3.13750724|27.0.12077973) ;;
              *) echo "Removing unused NDK: $ndk"; rm -rf "$ndk" ;;
            esac
          done
          df -h /
      # Home link, phone side (native/homelink): use the home PC's model from
      # anywhere. Built for ARM64 with the NDK pinned above into jniLibs.
      - name: Build the home link library (Rust)
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native' || inputs.stage == 'compilation'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          # cargo-ndk 4 reads the crate from the current folder (its
          # --manifest-path is not used for that), so run it from there.
          (cd native/homelink && cargo ndk -t arm64-v8a --platform 24 \
            -o ../../android/app/src/main/jniLibs build --release --locked --features android)
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          rm -rf native/homelink/target
      - name: Prepare diagnostic configuration
        run: python3 scripts/prepare-diagnostic-config.py
      - name: Verify Hexagon SDK for APK stage
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        uses: ./.github/actions/setup-hexagon-sdk
      - name: Configuration
        if: inputs.stage == 'configuration'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a help 2>&1 | tee diagnostic-build.log
      - name: Compilation
        if: inputs.stage == 'compilation'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a :app:compileProdDebugKotlin :app:compileProdDebugJavaWithJavac 2>&1 | tee diagnostic-build.log
      # Restore native intermediates from a prior attempt with matching inputs.
      # Cache reuse is best-effort and does not establish build correctness.
      - name: Validate native variant selection
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          node scripts/verify-android-payload.js --print-variants | tee native-variants.txt
          test -s native-variants.txt
          echo 'Required ARM64 native variants:'
          cat native-variants.txt
      - name: Restore native build intermediates
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/llama.rn/android/.cxx
            node_modules/llama.rn/android/build/intermediates/cxx
            node_modules/llama.rn/android/build/generated/source/codegen
          key: pocketagent-native-arm64-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            pocketagent-native-arm64-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-
      - name: Inspect native cache and disk budget
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        run: |
          set -euo pipefail
          echo 'Disk available before native compilation:'
          df -h /
          echo 'Cached llama.rn native build directories:'
          du -sh node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx node_modules/llama.rn/android/build/generated/source/codegen 2>/dev/null || true
          echo 'Largest Android and Gradle directories:'
          du -sh android/.gradle android/app/.cxx android/app/build "$HOME/.gradle/caches" "$HOME/.hexagon-sdk" 2>/dev/null || true
          free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if (( free_kb < 6291456 )); then
            echo "::error::Less than 6 GiB free before native compilation; refusing to exhaust runner disk." >&2
            exit 1
          fi
      # Rebuild after PocketAgent onboarding and Toolbox navigation updates.
      - name: Assemble and verify NPU APK
        if: github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native'
        timeout-minutes: 110
        run: |
          set -euo pipefail
          bash scripts/build-api-helper-npu.sh 2>&1 | tee diagnostic-build.log
      - name: Record native build disk usage
        if: always() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        run: |
          echo 'Disk after native build:' > native-build-diagnostics.txt
          df -h / >> native-build-diagnostics.txt
          echo 'Native build cache sizes:' >> native-build-diagnostics.txt
          du -sh node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx node_modules/llama.rn/android/build/generated/source/codegen android/app/.cxx android/app/build 2>/dev/null >> native-build-diagnostics.txt || true
          echo 'Native object counts:' >> native-build-diagnostics.txt
          for dir in node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build/intermediates/cxx android/app/.cxx; do
            if [ -d "$dir" ]; then
              printf '%s: ' "$dir" >> native-build-diagnostics.txt
              find "$dir" -type f -name '*.o' | wc -l >> native-build-diagnostics.txt
            fi
          done
          cat native-build-diagnostics.txt
      - name: Save native compilation progress
        if: always() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/llama.rn/android/.cxx
            node_modules/llama.rn/android/build/intermediates/cxx
            node_modules/llama.rn/android/build/generated/source/codegen
          key: pocketagent-native-arm64-v2-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json', 'android/build.gradle', 'android/gradle.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs-${{ inputs.stage || 'configuration' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-build.log
            native-build-diagnostics.txt
            native-variants.txt
            android/app/build/outputs/api-helper-npu-payload.txt
          if-no-files-found: warn
          # Small, but 14 days of them added up; 3 days is enough to debug.
          retention-days: 3
      - name: Keep verified APK
        if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
        uses: actions/upload-artifact@v4
        with:
          name: pocketagent-integration-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
          # Only the release job below needs this copy (minutes later); the
          # APK to install lives on the release. 14-day copies (~80 MB each)
          # filled the free Actions storage.
          retention-days: 1

  # Publishes the verified APK as a pre-release so it can be downloaded and
  # installed directly on the phone (artifacts need a signed-in browser and
  # arrive zipped). Only this job can write to the repository: it runs no
  # third-party actions, just GitHub's artifact download and the gh CLI.
  release:
    needs: diagnostic
    if: success() && (github.event_name == 'push' || inputs.stage == 'apk' || inputs.stage == 'native')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: pocketagent-integration-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk
      - name: Publish pre-release
        env:
          # Your own token (repo secret, this repo only: Contents + Workflows),
          # here only: the build token may not tag commits whose workflow
          # files differ from main's.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          tag="apk-${safe_branch}-${RUN_ID}-${RUN_ATTEMPT}"
          asset="PocketAgent-${safe_branch}-${RUN_ID}.apk"
          test -s apk/app-prod-debug.apk
          mv apk/app-prod-debug.apk "apk/${asset}"
          gh release create "$tag" "apk/${asset}" \
            --target "$SHA" \
            --prerelease \
            --title "PocketAgent test APK: ${BRANCH} (${SHA:0:7})" \
            --notes "Debug test build from branch \`${BRANCH}\`, commit ${SHA}, workflow run ${RUN_ID}. Not a release. Tap the .apk below on the phone to download and install."
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
