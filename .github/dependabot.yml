# Keeps the GitHub Actions in .github/workflows (pinned by full commit SHA,
# the version in a comment) up to date: Dependabot opens a pull request with
# the new SHA and version. Nothing is merged without review.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local actions in .github/actions.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
