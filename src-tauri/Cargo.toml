[package]
name = "pocketagent"
version = "0.1.0"
description = "PocketAgent for Windows"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "pocketagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "fs", "io-util", "net", "macros"] }
base64 = "0.22"
getrandom = "0.3"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }
# Home link: use this PC's model from the phone, from anywhere (link.rs).
# Devices dial each other by key; end-to-end encrypted; relays can't read it.
iroh = { version = "=1.4.1", optional = true }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"], optional = true }
# PC to PC: this PC as the other end of a home link (link_client.rs), with
# the phone's own link library.
homelink = { path = "../native/homelink", optional = true }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
pdf-extract = "=0.12.1"
quick-xml = "=0.42.0"
arboard = { version = "=3.7.0", default-features = false }
tauri-plugin-notification = "=2.8.1"
tauri-plugin-global-shortcut = "=2.4.1"
png = "=0.18.1"

[features]
default = ["link"]
# Off only for the Windows type-check on Linux, which has no Windows C
# compiler for iroh's crypto library (the real Windows build has one).
link = ["dep:iroh", "dep:qrcode", "dep:homelink"]

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# The page's own profiler at start-up (profile.rs): the same versions Tauri uses.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind, never abort: a fault in one task (e.g. the home link) must not
# close the whole app; Tokio and Tauri report it instead.
panic = "unwind"
strip = true
